name: CI

on:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7   # Python version comes from .python-version
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest   # on a fresh Linux machine
    env:
      BASE_URL: http://localhost:8000
      DB_URL: sqlite+aiosqlite:///./test.db
      SESSION_SECRET_KEY: test-only-not-secret
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked   # fails if uv.lock doesn't match pyproject.toml
      - name: Run tests
        run: uv run pytest -v
