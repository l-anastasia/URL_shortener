name: CI

on: 
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .

  test:
    runs-on: ubuntu-latest   # on a fresh Linux machine
    steps:
      - uses: actions/checkout@v6 
      - uses: actions/setup-python@v5 
        with:
          python-version: "3.12"         
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v