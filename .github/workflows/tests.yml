name: Tests                  # the name shown in the Actions tab

on:
  push:                      # run on every push, to any branch

jobs:
  test:
    runs-on: ubuntu-latest   # on a fresh Linux machine
    steps:
      - uses: actions/checkout@v6 
      - uses: actions/setup-python@v5 
        with:
          python-version: "3.12"         
          cache: pip                     # reuse downloaded packages on later runs
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v