<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a key — Latito</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/create-key.css') }}">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
</head>
<body>

{% set active_page = "create_url_page" %}
{% include "partials/topbar.html" %}

<div class="page">
  <div style="width:100%;max-width:480px;">
    <div class="card">
      <h1>Create a key</h1>
      <p class="subtitle">Paste a long URL and we'll generate a short key for it.</p>

      <!-- htmx: submits target_url to create_url_form and swaps the returned
           partials/create-key-result.html into #create-key-output -->
      <form hx-post="{{ url_for('create_url_form') }}"
            hx-target="#create-key-output"
            hx-swap="innerHTML"
            hx-disabled-elt="find button">
        <div class="field">
          <label for="url-input">Long URL</label>
          <input type="url" id="url-input" name="target_url" placeholder="https://example.com/a/very/long/path" required>
          <div class="hint">Must start with http:// or https://</div>
        </div>
        <button type="submit" class="btn btn-primary">Create key</button>
      </form>
        <div id="create-key-output"></div>   
    </div>
  </div>
</div>

<script>
  // Copy buttons arrive later inside htmx responses, so listen on the whole
  // document and react to any click on an element with data-copy.
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const input = document.querySelector(btn.dataset.copy);
    try {
      await navigator.clipboard.writeText(input.value);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    } catch {
      input.select();
    }
  });
</script>

</body>
</html>
