<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Latito</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body>

{% set active_page = "login_page" %}
{% include "partials/topbar.html" %}

<div class="page">
  <div style="width:100%;max-width:400px;">
    <div class="demo-banner">Styling preview — not yet connected to your FastAPI backend</div>

    <div class="card">
      <h1>Welcome</h1>
      <p class="subtitle" id="subtitle">Log in to your account</p>

      <div class="tabs">
        <button class="tab active" id="tab-login" data-tab="login">Log in</button>
        <button class="tab" id="tab-signup" data-tab="signup">Create account</button>
      </div>

      <!--
        FastAPI wiring (later):
        - action="/login" method="post" for this form
        - fields: username, password
        - show .msg.error using the message the endpoint returns on bad credentials
      -->
      <form class="tab-panel active" data-panel="login" id="login-form" novalidate>
        <div class="msg error" id="login-error">Invalid username or password.</div>
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <!--
        FastAPI wiring (later):
        - action="/register" method="post" for this form
        - fields: username, password, confirm_password (validate match server-side too)
      -->
      <form class="tab-panel" data-panel="signup" id="signup-form" novalidate>
        <div class="msg error" id="signup-error">Passwords don't match.</div>
        <div class="field">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <input type="password" id="signup-confirm" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
    </div>

    <p class="foot-note" id="foot-note">
      Don't have an account? <a href="#" id="switch-to-signup">Create one</a>
    </p>
  </div>
</div>

<script>
  // --- Tab switching (login vs create account) ---
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');
  const subtitle = document.getElementById('subtitle');
  const footNote = document.getElementById('foot-note');

  function setMode(mode){
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === mode));
    panels.forEach(p => p.classList.toggle('active', p.dataset.panel === mode));
    if(mode === 'login'){
      subtitle.textContent = 'Log in to your account';
      footNote.innerHTML = 'Don\'t have an account? <a href="#" id="switch-to-signup">Create one</a>';
      document.getElementById('switch-to-signup').addEventListener('click', e => { e.preventDefault(); setMode('signup'); });
    } else {
      subtitle.textContent = 'Create a new account';
      footNote.innerHTML = 'Already have an account? <a href="#" id="switch-to-login">Log in</a>';
      document.getElementById('switch-to-login').addEventListener('click', e => { e.preventDefault(); setMode('login'); });
    }
  }
  tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.tab)));
  document.getElementById('switch-to-signup').addEventListener('click', e => { e.preventDefault(); setMode('signup'); });

  // --- Mocked submit handling (styling preview only — replace with real requests later) ---
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('login-error').classList.remove('show');
    console.log('[preview] would POST /login with', new FormData(this));
  });
  document.getElementById('signup-form').addEventListener('submit', function(e){
    e.preventDefault();
    const pw = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const err = document.getElementById('signup-error');
    if(pw !== confirm){
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    console.log('[preview] would POST /register with', new FormData(this));
  });
</script>

</body>
</html>
