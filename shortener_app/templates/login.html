<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Latito</title>
<style>
  :root{
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f9fafb; --text:#16181f; --muted:#6b7280;
    --border:#e3e5ec; --primary:#4f46e5; --primary-hover:#4338ca; --primary-text:#ffffff;
    --danger:#dc2626; --success:#15803d; --radius:14px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,17,23,.04), 0 12px 28px -8px rgba(16,17,23,.10);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#171a21; --surface-2:#1d212a; --text:#e7e9ee; --muted:#9298a6;
      --border:#2a2e38; --primary:#6366f1; --primary-hover:#7c7ff0; --primary-text:#ffffff;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -8px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;justify-self:start}
  .brand-spacer{visibility:hidden;justify-self:end}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .nav-links{display:flex;gap:32px;justify-self:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:16px;font-weight:600;padding:8px 4px;border-bottom:2px solid transparent}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.current{color:var(--primary);border-bottom-color:var(--primary)}
  @media (max-width:640px){
    .topbar{grid-template-columns:1fr;row-gap:12px}
    .brand{justify-self:center}
    .brand-spacer{display:none}
    .nav-links{justify-self:center;flex-wrap:wrap;justify-content:center;gap:20px;font-size:15px}
  }
  .page{min-height:calc(100vh - 77px);display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
  .card h1{font-size:20px;margin:0 0 4px}
  .card .subtitle{color:var(--muted);font-size:14px;margin:0 0 20px}
  .demo-banner{max-width:400px;margin:0 auto 14px;font-size:12px;text-align:center;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:8px 10px}
  .tabs{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}
  .tab{flex:1;border:0;background:transparent;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer;font-family:inherit}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,17,23,.08)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
  .field input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .btn-primary{background:var(--primary);color:var(--primary-text)}
  .btn-primary:hover{background:var(--primary-hover)}
  .foot-note{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
  .foot-note a{color:var(--primary);text-decoration:none;font-weight:600}
  .msg{font-size:13px;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;display:none}
  .msg.show{display:block}
  .msg.error{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2)}
  .msg.success{background:rgba(21,128,61,.08);color:var(--success);border:1px solid rgba(21,128,61,.2)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-mark">L</span>Latito</div>
  <!-- Preview-only nav for reviewing the pages together. Remove once these are real templates. -->
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="create-key.html">Create a key</a>
    <a href="redirect.html">Redirect</a>
    <a href="manage-key.html">Manage key</a>
    <a href="login.html" class="current">Log in</a>
  </div>
  <div class="brand brand-spacer" aria-hidden="true"><span class="brand-mark">L</span>Latito</div>
</div>

<div class="page">
  <div style="width:100%;max-width:400px;">
    <div class="demo-banner">Styling preview — not yet connected to your FastAPI backend</div>

    <div class="card">
      <h1>Welcome</h1>
      <p class="subtitle" id="subtitle">Log in to your account</p>

      <div class="tabs">
        <button class="tab active" id="tab-login" data-tab="login">Log in</button>
        <button class="tab" id="tab-signup" data-tab="signup">Create account</button>
      </div>

      <!--
        FastAPI wiring (later):
        - action="/login" method="post" for this form
        - fields: username, password
        - show .msg.error using the message the endpoint returns on bad credentials
      -->
      <form class="tab-panel active" data-panel="login" id="login-form" novalidate>
        <div class="msg error" id="login-error">Invalid username or password.</div>
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <!--
        FastAPI wiring (later):
        - action="/register" method="post" for this form
        - fields: username, password, confirm_password (validate match server-side too)
      -->
      <form class="tab-panel" data-panel="signup" id="signup-form" novalidate>
        <div class="msg error" id="signup-error">Passwords don't match.</div>
        <div class="field">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <input type="password" id="signup-confirm" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
    </div>

    <p class="foot-note" id="foot-note">
      Don't have an account? <a href="#" id="switch-to-signup">Create one</a>
    </p>
  </div>
</div>

<script>
  // --- Tab switching (login vs create account) ---
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');
  const subtitle = document.getElementById('subtitle');
  const footNote = document.getElementById('foot-note');

  function setMode(mode){
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === mode));
    panels.forEach(p => p.classList.toggle('active', p.dataset.panel === mode));
    if(mode === 'login'){
      subtitle.textContent = 'Log in to your account';
      footNote.innerHTML = 'Don\'t have an account? <a href="#" id="switch-to-signup">Create one</a>';
      document.getElementById('switch-to-signup').addEventListener('click', e => { e.preventDefault(); setMode('signup'); });
    } else {
      subtitle.textContent = 'Create a new account';
      footNote.innerHTML = 'Already have an account? <a href="#" id="switch-to-login">Log in</a>';
      document.getElementById('switch-to-login').addEventListener('click', e => { e.preventDefault(); setMode('login'); });
    }
  }
  tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.tab)));
  document.getElementById('switch-to-signup').addEventListener('click', e => { e.preventDefault(); setMode('signup'); });

  // --- Mocked submit handling (styling preview only — replace with real requests later) ---
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('login-error').classList.remove('show');
    console.log('[preview] would POST /login with', new FormData(this));
  });
  document.getElementById('signup-form').addEventListener('submit', function(e){
    e.preventDefault();
    const pw = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const err = document.getElementById('signup-error');
    if(pw !== confirm){
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    console.log('[preview] would POST /register with', new FormData(this));
  });
</script>

</body>
</html>
