<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"methodsThatUseUrlParams":["get"]}'>
<title>Manage a key — Revelio</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/manage-key.css') }}">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
</head>
<body>

{% set active_page = "manage_page" %}
{% set show_admin_badge = true %}
{% include "partials/topbar.html" %}

<div class="page">
  <div style="width:100%;max-width:480px;">
    <div class="card">
      <!-- htmx: the admin key is posted to manage_key_form. The response
           (partials/manage-key-result.html) fills #manage-output; on success it
           also replaces #gate-panel out-of-band, which hides the form. -->
      <div id="gate-panel">
        <h1>Manage a key</h1>
        <p class="subtitle">Enter the admin key for the link you want to manage.</p>
        <form hx-post="{{ url_for('manage_key_form') }}"
              hx-target="#manage-output"
              hx-swap="innerHTML"
              hx-disabled-elt="find button">
          <div class="field">
            <label for="admin-key-input">Admin key</label>
            <input type="text" id="admin-key-input" name="secret_key"
                   placeholder="e.g. AB3XY_K7Q2M9PL" autocomplete="off" required>
          </div>
          <button type="submit" class="btn btn-primary">Unlock</button>
        </form>
      </div>

      <div id="manage-output"></div>
    </div>
  </div>
</div>

<script>
  // Show/Hide for the admin key. The button arrives inside an htmx response,
  // so listen on the whole document (same pattern as the copy buttons).
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-toggle-secret]');
    if (!btn) return;
    const value = btn.parentElement.querySelector('.secret-value');
    const hidden = btn.textContent === 'Show';
    value.textContent = hidden ? value.dataset.value : '••••••••••';
    btn.textContent = hidden ? 'Hide' : 'Show';
  });

  // Delete confirmation. "Delete this key" opens the inline confirm box, "Cancel"
  // closes it; the DELETE request itself is sent by htmx from "Yes, delete".
  document.addEventListener('click', (e) => {
    const open = e.target.closest('[data-confirm-open]');
    const cancel = e.target.closest('[data-confirm-cancel]');
    if (!open && !cancel) return;
    const zone = e.target.closest('.danger-zone');
    zone.classList.toggle('confirming', !!open);
    // Move focus to the safe choice when opening, and back when cancelling.
    zone.querySelector(open ? '[data-confirm-cancel]' : '[data-confirm-open]').focus();
  });

  // Escape closes an open confirm box, like a dialog.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const zone = document.querySelector('.danger-zone.confirming');
    if (!zone) return;
    zone.classList.remove('confirming');
    zone.querySelector('[data-confirm-open]').focus();
  });

  // Show server dates (UTC) in the visitor's local time. htmx.onLoad runs for the
  // initial page and again for every piece of HTML htmx swaps in later.
  htmx.onLoad((root) => {
    root.querySelectorAll('time[data-local]').forEach((el) => {
      const date = new Date(el.dateTime);
      el.textContent = date.toLocaleString(undefined, {
        dateStyle: 'medium',
        timeStyle: 'short',
      });
      el.title = date.toString();   // full date with time zone on hover
    });
  });
</script>

</body>
</html>
