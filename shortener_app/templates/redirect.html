<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go to a link — Latito</title>
<style>
  :root{
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f9fafb; --text:#16181f; --muted:#6b7280;
    --border:#e3e5ec; --primary:#4f46e5; --primary-hover:#4338ca; --primary-text:#ffffff;
    --danger:#dc2626; --success:#15803d; --radius:14px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,17,23,.04), 0 12px 28px -8px rgba(16,17,23,.10);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#171a21; --surface-2:#1d212a; --text:#e7e9ee; --muted:#9298a6;
      --border:#2a2e38; --primary:#6366f1; --primary-hover:#7c7ff0; --primary-text:#ffffff;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -8px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;justify-self:start}
  .brand-spacer{visibility:hidden;justify-self:end}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .nav-links{display:flex;gap:32px;justify-self:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:16px;font-weight:600;padding:8px 4px;border-bottom:2px solid transparent}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.current{color:var(--primary);border-bottom-color:var(--primary)}
  @media (max-width:640px){
    .topbar{grid-template-columns:1fr;row-gap:12px}
    .brand{justify-self:center}
    .brand-spacer{display:none}
    .nav-links{justify-self:center;flex-wrap:wrap;justify-content:center;gap:20px;font-size:15px}
  }
  .page{min-height:calc(100vh - 77px);display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;text-align:center}
  .icon-badge{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--primary)}
  .icon-badge svg{width:22px;height:22px}
  .card h1{font-size:20px;margin:0 0 4px}
  .card .subtitle{color:var(--muted);font-size:14px;margin:0 0 20px}
  .demo-banner{max-width:400px;margin:0 auto 14px;font-size:12px;text-align:center;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:8px 10px}
  .field{margin-bottom:14px;text-align:left}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
  .field input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .btn-primary{background:var(--primary);color:var(--primary-text)}
  .btn-primary:hover{background:var(--primary-hover)}
  .msg{font-size:13px;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;display:none;text-align:left}
  .msg.show{display:block}
  .msg.error{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2)}
  .msg.pending{background:rgba(79,70,229,.08);color:var(--primary);border:1px solid rgba(79,70,229,.2)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-mark">L</span>Latito</div>
  <!-- Preview-only nav for reviewing the pages together. Remove once these are real templates. -->
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="create-key.html">Create a key</a>
    <a href="redirect.html" class="current">Redirect</a>
    <a href="manage-key.html">Manage key</a>
    <a href="login.html">Log in</a>
  </div>
  <div class="brand brand-spacer" aria-hidden="true"><span class="brand-mark">L</span>Latito</div>
</div>

<div class="page">
  <div style="width:100%;max-width:400px;">
    <div class="demo-banner">Styling preview — lookup is mocked, not yet connected to your FastAPI backend</div>

    <div class="card">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </div>
      <h1>Go to a link</h1>
      <p class="subtitle">Enter a short key to jump to its destination.</p>

      <!--
        FastAPI wiring (later):
        In most FastAPI URL-shorteners the redirect happens directly at a GET route
        like @app.get("/{key}") which issues a RedirectResponse — no page needed for
        that. This form is for a manual "type a key and go" flow (e.g. a lookup box).
        Options once connected:
          - fetch(`/api/${key}`) to resolve the destination, then window.location = dest
          - or just navigate the browser straight to `/${key}` and let FastAPI redirect
      -->
      <form id="key-form" novalidate>
        <div class="msg error" id="key-error">That key wasn't found.</div>
        <div class="msg pending" id="key-pending">Redirecting to the destination… (preview only)</div>
        <div class="field">
          <label for="key-input">Short key</label>
          <input type="text" id="key-input" name="key" placeholder="e.g. abc123" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-primary">Go</button>
      </form>
    </div>
  </div>
</div>

<script>
  // --- Mocked lookup flow (styling preview only — replace with a real request/redirect later) ---
  document.getElementById('key-form').addEventListener('submit', function(e){
    e.preventDefault();
    const key = document.getElementById('key-input').value.trim();
    const errorMsg = document.getElementById('key-error');
    const pendingMsg = document.getElementById('key-pending');
    errorMsg.classList.remove('show');
    pendingMsg.classList.remove('show');
    if(!key){ errorMsg.classList.add('show'); return; }
    console.log('[preview] would look up key:', key);
    pendingMsg.classList.add('show');
    // In the real app this becomes: window.location.href = `/${key}`;
  });
</script>

</body>
</html>
